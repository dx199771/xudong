<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoT-Feedback — Human Evaluation</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #F0F2F5;
  --surface:   #FFFFFF;
  --surface-alt:#F6F7F9;
  --border:    #DDE1E7;
  --border-hi: #B8BFC9;
  --text:      #111827;
  --text-2:    #4B5563;
  --text-3:    #9CA3AF;
  --blue:      #1864AB;
  --blue-lt:   #E8F0FB;
  --blue-bd:   #BFCFE8;
  --green-lt:  #DCFCE7;
  --r:         6px;
  --r-lg:      10px;
  --mono:      'JetBrains Mono','Fira Mono','Menlo',monospace;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'PingFang SC', 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.6; min-height: 100vh;
}

/* ── Header ── */
.hdr { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; padding: 0 1.5rem; }
.hdr-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 52px; gap: 12px; }
.hdr-logo { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; flex-shrink: 1; min-width: 0; white-space: nowrap; }
.hdr-badge { font-size: 10px; font-weight: 500; background: var(--blue-lt); color: var(--blue); border: 1px solid var(--blue-bd); border-radius: 3px; padding: 2px 6px; letter-spacing: .04em; text-transform: uppercase; }
.hdr-right { display: flex !important; align-items: center; gap: 14px; flex-shrink: 0; }
.hdr-prog { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); }
.prog-track { width: 90px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--blue); border-radius: 2px; transition: width .35s ease; }
.lang-toggle { display: flex !important; border: 1px solid var(--border-hi); border-radius: var(--r); overflow: hidden; }
.lang-btn { padding: 4px 10px; font-size: 12px; font-weight: 500; cursor: pointer; background: var(--surface); color: var(--text-3); border: none; transition: all .12s; }
.lang-btn.active { background: var(--blue); color: #fff; }

/* ── Page ── */
.page { max-width: 900px; margin: 0 auto; padding: 1.75rem 1.5rem 5rem; }
.hidden { display: none !important; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 1.5rem; margin-bottom: 1rem; }

/* ── Welcome ── */
.welcome-title { font-size: 20px; font-weight: 600; letter-spacing: -.02em; margin-bottom: .4rem; }
.welcome-sub { color: var(--text-2); margin-bottom: 1.5rem; max-width: 560px; }
.info-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: .75rem; margin-bottom: 1.5rem; }
.info-cell { background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--r); padding: .85rem 1rem; }
.info-label { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin-bottom: 3px; }
.info-val { font-size: 13px; font-weight: 500; }
.field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 5px; }
.field input { width: 100%; max-width: 320px; padding: 8px 11px; font-size: 13px; border: 1px solid var(--border-hi); border-radius: var(--r); background: var(--surface); color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s; }
.field input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(24,100,171,.1); }

/* ── Buttons ── */
.btn { display: inline-flex; align-items: center; gap: 5px; padding: 8px 18px; border-radius: var(--r); font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all .13s; }
.btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn-primary:hover { background: #155EA0; }
.btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border-hi); }
.btn-ghost:hover { background: var(--surface-alt); }
.btn-row { display: flex; align-items: center; justify-content: space-between; margin-top: 1.5rem; }

/* ── Sample header ── */
.smp-hdr { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .5rem; }
.smp-meta { font-size: 11px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 3px; }
.smp-title { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.smp-pill { font-size: 11px; font-weight: 500; background: var(--blue-lt); color: var(--blue); border: 1px solid var(--blue-bd); border-radius: 20px; padding: 4px 12px; white-space: nowrap; }
.sec-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin-bottom: .85rem; }

/* ── Video ── */
video { width: 100%; border-radius: var(--r); border: 1px solid var(--border); background: #000; display: block; object-fit: contain; }
.vid-note { font-size: 11px; color: var(--text-3); margin-top: 6px; text-align: center; }

/* ── Feedback columns ── */
.fb-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 1px;
}
.fb-col {
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}
.fb-col-hdr {
  background: var(--surface-alt);
  border-bottom: 1px solid var(--border);
  padding: 7px 12px;
  font-size: 11px; font-weight: 700;
  letter-spacing: .06em; font-family: var(--mono);
  color: var(--text-2);
}
.fb-col-body {
  padding: 12px;
  font-size: 13px; color: var(--text); line-height: 1.6;
}

/* ── Questions table ── */
.q-table {
  width: 100%;
  border-collapse: collapse;
}
.q-table tr { border-bottom: 1px solid var(--border); }
.q-table tr:last-child { border-bottom: none; }
.q-table td { padding: 12px 8px; vertical-align: middle; }
.q-desc {
  font-size: 13px; color: var(--text);
  width: 100%;
}
.q-opts {
  display: flex; gap: 6px;
  white-space: nowrap;
}
.q-opt {
  display: flex; flex-direction: column;
  align-items: center; gap: 3px;
  cursor: pointer;
}
.q-opt-label {
  font-size: 10px; font-weight: 700;
  font-family: var(--mono); color: var(--text-3);
}
.q-opt-radio {
  width: 32px; height: 32px;
  border-radius: var(--r);
  border: 1px solid var(--border-hi);
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all .12s;
  font-size: 11px; font-weight: 700;
  font-family: var(--mono); color: var(--text-3);
}
.q-opt-radio:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-lt); }
.q-opt-radio.sel { border-color: var(--blue); background: var(--blue); color: #fff; }

/* ── Overall preference ── */
.overall-row {
  display: flex; align-items: center;
  justify-content: space-between;
  gap: 1rem; flex-wrap: wrap;
  padding: 14px 0 2px;
  border-top: 2px solid var(--border);
  margin-top: 4px;
}
.overall-desc { font-size: 13px; font-weight: 500; color: var(--text); }
.overall-opts { display: flex; gap: 6px; }
.pref-btn {
  width: 40px; height: 34px;
  border-radius: var(--r); border: 1px solid var(--border-hi);
  background: var(--surface); font-size: 12px; font-weight: 700;
  font-family: var(--mono); cursor: pointer; color: var(--text-2);
  transition: all .12s;
  display: flex; align-items: center; justify-content: center;
}
.pref-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-lt); }
.pref-btn.sel { border-color: var(--blue); background: var(--blue); color: #fff; }

/* ── Validation ── */
.val-msg { font-size: 12px; color: #991B1B; background: #FEF2F2; border: 1px solid #FECACA; border-radius: var(--r); padding: 9px 13px; margin-top: .85rem; display: none; }
.val-msg.show { display: block; }

/* ── Complete ── */
.complete-wrap { text-align: center; padding: 2.5rem 1.5rem; }
.check-circle { width: 48px; height: 48px; border-radius: 50%; background: var(--green-lt); border: 1px solid #86EFAC; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; font-size: 20px; }
.complete-h { font-size: 19px; font-weight: 600; margin-bottom: .4rem; }
.complete-sub { color: var(--text-2); max-width: 420px; margin: 0 auto 1.75rem; }
.resp-preview { background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--r); padding: 1rem 1.25rem; text-align: left; margin: 0 auto 1.25rem; max-width: 380px; }
.resp-preview h4 { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); margin-bottom: .6rem; }
.resp-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--border); color: var(--text-2); }
.resp-row:last-child { border-bottom: none; }
.resp-row strong { color: var(--text); }
.dl-btn { background: var(--surface); border: 1px solid var(--border-hi); border-radius: var(--r); padding: 9px 18px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text); transition: all .13s; display: inline-flex; align-items: center; gap: 5px; }
.dl-btn:hover { background: var(--blue-lt); border-color: var(--blue); color: var(--blue); }

@media (max-width: 640px) {
  .fb-grid { grid-template-columns: 1fr; }
  .info-grid { grid-template-columns: 1fr 1fr; }
  .btn-row { flex-direction: column-reverse; gap: .5rem; }
  .q-table td:last-child { padding-left: 0; }
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <div class="hdr-logo">
      BoT-Feedback <span class="hdr-badge">Human Eval</span>
    </div>
    <div class="hdr-right">
      <div class="lang-toggle">
        <button class="lang-btn active" id="lang-en" onclick="setLang('en')">EN</button>
        <button class="lang-btn"        id="lang-zh" onclick="setLang('zh')">中文</button>
      </div>
      <div class="hdr-prog hidden" id="hdr-prog">
        <span id="prog-text">1 / 8</span>
        <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:12.5%"></div></div>
      </div>
    </div>
  </div>
</header>

<main class="page">

  <!-- Welcome -->
  <div id="scr-welcome">
    <div class="card">
      <div class="welcome-title" id="w-title"></div>
      <div class="welcome-sub"   id="w-desc"></div>
      <div class="info-grid"     id="w-info"></div>
      <div class="field" style="margin-bottom:1.5rem">
        <label for="inp-name" id="lbl-name"></label>
        <input type="text" id="inp-name" autocomplete="off">
      </div>
      <div style="display:flex;justify-content:flex-end">
        <button class="btn btn-primary" id="btn-start"></button>
      </div>
    </div>
  </div>

  <!-- Sample -->
  <div id="scr-sample" class="hidden">

    <div class="card" style="margin-bottom:.85rem">
      <div class="smp-hdr">
        <div>
          <div class="smp-meta"  id="smp-num"></div>
          <div class="smp-title" id="smp-action"></div>
        </div>
        <div class="smp-pill" id="smp-pill"></div>
      </div>
    </div>

    <!-- Video -->
    <div class="card">
      <div class="sec-label" id="sec-video"></div>
      <video id="vid-main" controls playsinline preload="metadata"></video>
      <div class="vid-note" id="vid-note"></div>
    </div>

    <!-- Feedback columns + Questions -->
    <div class="card">
      <div class="sec-label" id="sec-rate"></div>

      <!-- Three feedback columns -->
      <div class="fb-grid" id="fb-grid"></div>

      <!-- Questions -->
      <table class="q-table" id="q-table" style="margin-top:16px"></table>

      <!-- Overall preference -->
      <div class="overall-row">
        <div class="overall-desc" id="overall-desc"></div>
        <div class="overall-opts" id="overall-opts"></div>
      </div>
    </div>

    <div class="val-msg" id="val-msg"></div>

    <div class="btn-row">
      <button class="btn btn-ghost"   id="btn-prev" style="visibility:hidden"></button>
      <button class="btn btn-primary" id="btn-next"></button>
    </div>
  </div>

  <!-- Complete -->
  <div id="scr-complete" class="hidden">
    <div class="card">
      <div class="complete-wrap">
        <div class="check-circle">✓</div>
        <div class="complete-h"   id="done-h"></div>
        <div class="complete-sub" id="done-sub"></div>
        <div class="resp-preview">
          <h4 id="done-summary"></h4>
          <div id="resp-rows"></div>
        </div>
        <button class="dl-btn" id="btn-dl"></button>
      </div>
    </div>
  </div>

</main>

<script>
/* ── i18n ── */
const T = {
  en: {
    title:       'BoT-Feedback — Human Evaluation',
    desc:        'You will watch 8 pairs of sports videos and evaluate three coaching feedback variants. Variants are labelled A / B / C in randomised order. Please rate each question independently.',
    info_pairs:  'Video pairs', info_metrics: 'Questions', info_time: 'Est. time',
    lbl_name:    'Your name', name_ph: 'e.g. Alex Chen', btn_start: 'Begin evaluation →',
    sec_video:   'Video — left: expert (reference) · right: student',
    vid_note:    'Expert is on the left, student is on the right.',
    sec_rate:    'Feedback & Questions',
    feedback:    'Feedback',
    questions: [
      'Which feedback provides the most specific and actionable physical correction?',
      'Which feedback best aligns with what an expert coach would say?',
      'Which feedback is most consistent with the movement observed in the video (no hallucination)?',
      'Which feedback contains the highest-value technical insight with least filler?',
    ],
    overall:     'Overall, which single feedback would you most recommend to the student?',
    val_msg:     'Please answer all questions and select an overall preference before continuing.',
    btn_prev: '← Back', btn_next: 'Next →', btn_finish: 'Finish ✓',
    sample_of:   (i,n) => `Sample ${i} of ${n}`,
    done_h:      'All done — thank you!',
    done_sub:    'Please download the JSON file and send it to the study coordinator.',
    done_summary:'Summary', resp_rater: 'Rater',
    resp_samples:'Samples rated', resp_total: 'Answers given',
    btn_dl:      '↓ Download responses (JSON)', alert_name: 'Please enter your name.',
  },
  zh: {
    title:       'BoT-Feedback — 人工评估',
    desc:        '您将观看 8 对运动视频，并对三条运动反馈进行评估。反馈以 A / B / C 随机顺序呈现，请独立回答每个问题。',
    info_pairs:  '视频对数', info_metrics: '问题数', info_time: '预计时长',
    lbl_name:    '您的姓名', name_ph: '例：张三', btn_start: '开始评估 →',
    sec_video:   '视频 — 左：专家（参考）· 右：学生',
    vid_note:    '视频左侧为专家示范，右侧为学生动作。',
    sec_rate:    '反馈与问题',
    feedback:    '反馈',
    questions: [
      '哪条反馈提供了最具体、最可操作的身体纠正建议？',
      '哪条反馈最符合专业教练会给出的意见？',
      '哪条反馈与视频中观察到的动作最一致（无幻觉或错误描述）？',
      '哪条反馈包含最高价值的专业洞见，冗余内容最少？',
    ],
    overall:     '综合来看，您最推荐将哪条反馈提供给学生？',
    val_msg:     '请回答所有问题并选择总体偏好后再继续。',
    btn_prev: '← 上一条', btn_next: '下一条 →', btn_finish: '完成 ✓',
    sample_of:   (i,n) => `第 ${i} / ${n} 组`,
    done_h:      '全部完成，感谢您的参与！',
    done_sub:    '请下载 JSON 文件并发送给研究负责人。',
    done_summary:'评估摘要', resp_rater: '评估者',
    resp_samples:'已评估组数', resp_total: '已回答问题数',
    btn_dl:      '↓ 下载评分结果 (JSON)', alert_name: '请输入您的姓名。',
  }
};

/* ── State ── */
let DATA = null, lang = 'en', idx = 0, raterName = '';
let responses = [], orders = [], studyStarted = false;

function setLang(l) {
  lang = l;
  document.getElementById('lang-en').classList.toggle('active', l==='en');
  document.getElementById('lang-zh').classList.toggle('active', l==='zh');
  if (!studyStarted) renderWelcome(); else renderSample(idx);
}

async function init() {
  try { const r = await fetch('data.json'); DATA = await r.json(); }
  catch(e) { document.getElementById('w-desc').textContent = 'Could not load data.json.'; return; }

  // Randomly pick 5 samples if more than 5 are available
  if (DATA.samples.length > 5) {
    const shuffled = [...DATA.samples].sort(() => Math.random() - 0.5);
    DATA.samples = shuffled.slice(0, 5);
  }

  orders = DATA.samples.map(s => {
    const arr = s.feedbacks.map((_,i) => i);
    for (let i = arr.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
  });

  // responses[i].answers[qIdx] = feedbackId chosen
  responses = DATA.samples.map(s => ({ sampleId: s.id, action: s.action, answers: {}, preference: null }));
  renderWelcome();
}

function renderWelcome() {
  const t = T[lang], n = DATA.samples.length;
  document.getElementById('w-title').textContent   = t.title;
  document.getElementById('w-desc').textContent    = t.desc;
  document.getElementById('lbl-name').textContent  = t.lbl_name;
  document.getElementById('inp-name').placeholder  = t.name_ph;
  document.getElementById('btn-start').textContent = t.btn_start;
  document.getElementById('w-info').innerHTML = `
    <div class="info-cell"><div class="info-label">${t.info_pairs}</div><div class="info-val">${n}</div></div>
    <div class="info-cell"><div class="info-label">${t.info_metrics}</div><div class="info-val">${t.questions.length + 1}</div></div>
    <div class="info-cell"><div class="info-label">${t.info_time}</div><div class="info-val">${Math.ceil(n*2)}–${n*4} min</div></div>
  `;
  document.getElementById('btn-start').onclick = startStudy;
}

function startStudy() {
  const name = document.getElementById('inp-name').value.trim();
  if (!name) { alert(T[lang].alert_name); return; }
  raterName = name; studyStarted = true;
  document.getElementById('scr-welcome').classList.add('hidden');
  document.getElementById('hdr-prog').classList.remove('hidden');
  renderSample(0);
}

function renderSample(i) {
  idx = i;
  const t = T[lang], s = DATA.samples[i], order = orders[i], n = DATA.samples.length;
  const labels = ['A','B','C','D','E'];

  document.getElementById('smp-num').textContent   = t.sample_of(i+1, n);
  document.getElementById('smp-action').textContent= s.action;
  document.getElementById('smp-pill').textContent  = s.action;
  document.getElementById('prog-text').textContent = `${i+1} / ${n}`;
  document.getElementById('prog-fill').style.width = `${((i+1)/n)*100}%`;
  document.getElementById('sec-video').textContent = t.sec_video;
  document.getElementById('vid-note').textContent  = t.vid_note;
  document.getElementById('sec-rate').textContent  = t.sec_rate;
  document.getElementById('val-msg').textContent   = t.val_msg;
  document.getElementById('btn-prev').textContent  = t.btn_prev;
  document.getElementById('btn-next').textContent  = i===n-1 ? t.btn_finish : t.btn_next;
  document.getElementById('overall-desc').textContent = t.overall;
  document.getElementById('vid-main').src = s.video;
  document.getElementById('vid-main').load();

  /* ── Feedback columns ── */
  const fg = document.getElementById('fb-grid');
  fg.innerHTML = '';
  order.forEach((fbIdx, dispIdx) => {
    const fb = s.feedbacks[fbIdx], label = labels[dispIdx];
    const col = document.createElement('div');
    col.className = 'fb-col';
    col.innerHTML = `
      <div class="fb-col-hdr">${t.feedback} ${label}</div>
      <div class="fb-col-body">${fb.text}</div>`;
    fg.appendChild(col);
  });

  /* ── Questions ── */
  const qt = document.getElementById('q-table');
  qt.innerHTML = '';
  t.questions.forEach((qText, qIdx) => {
    const saved = responses[i].answers[qIdx];
    const tr = document.createElement('tr');

    let optHtml = '<div class="q-opts">';
    order.forEach((fbIdx, dispIdx) => {
      const fb = s.feedbacks[fbIdx], label = labels[dispIdx];
      optHtml += `
        <div class="q-opt">
          <div class="q-opt-label">${label}</div>
          <div class="q-opt-radio${saved===fb.id?' sel':''}"
               data-q="${qIdx}" data-fb="${fb.id}">${label}</div>
        </div>`;
    });
    optHtml += '</div>';

    tr.innerHTML = `
      <td class="q-desc">${qText}</td>
      <td style="padding-left:16px">${optHtml}</td>`;
    qt.appendChild(tr);
  });

  // Question click handlers
  qt.querySelectorAll('.q-opt-radio').forEach(btn => {
    btn.addEventListener('click', () => {
      const qIdx = parseInt(btn.dataset.q), fbId = btn.dataset.fb;
      responses[idx].answers[qIdx] = fbId;
      qt.querySelectorAll(`.q-opt-radio[data-q="${qIdx}"]`).forEach(b => b.classList.toggle('sel', b.dataset.fb===fbId));
    });
  });

  /* ── Overall preference ── */
  const oo = document.getElementById('overall-opts');
  oo.innerHTML = '';
  order.forEach((fbIdx, dispIdx) => {
    const fb = s.feedbacks[fbIdx], label = labels[dispIdx];
    const btn = document.createElement('button');
    btn.className = 'pref-btn' + (responses[i].preference===fb.id?' sel':'');
    btn.textContent = label;
    btn.addEventListener('click', () => {
      responses[idx].preference = fb.id;
      oo.querySelectorAll('.pref-btn').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
    });
    oo.appendChild(btn);
  });

  document.getElementById('btn-prev').style.visibility = i===0 ? 'hidden' : 'visible';
  document.getElementById('val-msg').classList.remove('show');
  document.getElementById('scr-sample').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function validate() {
  const r = responses[idx], s = DATA.samples[idx], t = T[lang];
  for (let q = 0; q < t.questions.length; q++) if (!r.answers[q]) return false;
  return !!r.preference;
}

document.getElementById('btn-next').addEventListener('click', () => {
  if (!validate()) { document.getElementById('val-msg').classList.add('show'); return; }
  const n = DATA.samples.length;
  if (idx < n-1) { document.getElementById('scr-sample').classList.add('hidden'); renderSample(idx+1); }
  else showComplete();
});

document.getElementById('btn-prev').addEventListener('click', () => {
  if (idx > 0) { document.getElementById('scr-sample').classList.add('hidden'); renderSample(idx-1); }
});

function showComplete() {
  const t = T[lang];
  document.getElementById('scr-sample').classList.add('hidden');
  document.getElementById('hdr-prog').classList.add('hidden');
  document.getElementById('scr-complete').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  document.getElementById('done-h').textContent       = t.done_h;
  document.getElementById('done-sub').textContent     = t.done_sub;
  document.getElementById('done-summary').textContent = t.done_summary;
  document.getElementById('btn-dl').textContent       = t.btn_dl;
  const totalAns = responses.reduce((a,r) => a + Object.keys(r.answers).length + (r.preference?1:0), 0);
  document.getElementById('resp-rows').innerHTML = `
    <div class="resp-row">${t.resp_rater}   <strong>${raterName}</strong></div>
    <div class="resp-row">${t.resp_samples} <strong>${DATA.samples.length}</strong></div>
    <div class="resp-row">${t.resp_total}   <strong>${totalAns}</strong></div>
  `;
}

document.getElementById('btn-dl').addEventListener('click', () => {
  const out = { rater:{name:raterName}, lang, timestamp:new Date().toISOString(), responses };
  const blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href=url; a.download=`eval_${raterName.replace(/\s+/g,'_')}_${Date.now()}.json`;
  a.click(); URL.revokeObjectURL(url);
});

init();
</script>
</body>
</html>
